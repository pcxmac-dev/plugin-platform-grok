[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-grok"
version = "0.3.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Grok for Liminal: xAI's models through the Responses API, evaluating standardized arguments on your own API key, with the tiers and prices written in."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the AI assistant kind: liminal_libs.assistants, plugin API 2.2)
dependencies = ["liminal-libs>=1.49.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
grok = "plugin_platform_grok"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
